openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API for the AMD Arabic Islamic books library
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health checks
  - name: library
    description: Public book discovery and catalog
  - name: account
    description: Reader's saved books and progress
  - name: administration
    description: Admin-only library management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /library/overview:
    get:
      operationId: getLibraryOverview
      tags: [library]
      summary: Get the library home page summary
      responses:
        "200":
          description: Library summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryOverview"
  /books:
    get:
      operationId: listBooks
      tags: [library]
      summary: Search and browse published books
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, title, popular]
            default: newest
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Matching books
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookSearchResults"
  /books/{bookId}:
    get:
      operationId: getBook
      tags: [library]
      summary: Get book details and its table of contents
      parameters:
        - name: bookId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Book and table of contents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookDetail"
        "404":
          description: Book not found
  /account/library:
    get:
      operationId: getAccountLibrary
      tags: [account]
      summary: Get the signed-in reader's favorites and reading progress
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Reader's personal library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountLibrary"
        "401":
          description: Sign-in required
  /account/favorites/{bookId}:
    put:
      operationId: addFavorite
      tags: [account]
      summary: Save a book to the reader's library
      security:
        - cookieAuth: []
      parameters:
        - name: bookId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Favorite saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteStatus"
        "401":
          description: Sign-in required
    delete:
      operationId: removeFavorite
      tags: [account]
      summary: Remove a book from the reader's library
      security:
        - cookieAuth: []
      parameters:
        - name: bookId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204":
          description: Favorite removed
        "401":
          description: Sign-in required
  /account/progress/{bookId}:
    put:
      operationId: updateReadingProgress
      tags: [account]
      summary: Save the reader's position in a book
      security:
        - cookieAuth: []
      parameters:
        - name: bookId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressInput"
      responses:
        "200":
          description: Updated reading progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingProgress"
        "401":
          description: Sign-in required
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [administration]
      summary: Get library administration summary
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Administration summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "401":
          description: Sign-in required
        "403":
          description: Administrator access required
  /admin/books:
    post:
      operationId: createBook
      tags: [administration]
      summary: Add a book and its index entries
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookInput"
      responses:
        "201":
          description: Book created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookDetail"
        "401":
          description: Sign-in required
        "403":
          description: Administrator access required
  /admin/books/{bookId}:
    patch:
      operationId: updateBook
      tags: [administration]
      summary: Edit a book and its index entries
      security:
        - cookieAuth: []
      parameters:
        - name: bookId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookUpdate"
      responses:
        "200":
          description: Updated book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookDetail"
        "401":
          description: Sign-in required
        "403":
          description: Administrator access required
        "404":
          description: Book not found
    delete:
      operationId: deleteBook
      tags: [administration]
      summary: Remove a book and its index entries
      security:
        - cookieAuth: []
      parameters:
        - name: bookId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204":
          description: Book removed
        "401":
          description: Sign-in required
        "403":
          description: Administrator access required
        "404":
          description: Book not found
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Book:
      type: object
      required: [id, title, author, description, category, featured, status, sectionCount, createdAt, updatedAt]
      properties:
        id: { type: integer }
        title: { type: string }
        author: { type: string }
        description: { type: string }
        category: { type: string }
        coverUrl: { type: ["string", "null"] }
        readerUrl: { type: ["string", "null"] }
        downloadUrl: { type: ["string", "null"] }
        featured: { type: boolean }
        publishedYear: { type: ["integer", "null"] }
        status: { type: string, enum: [published, draft] }
        sectionCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BookSection:
      type: object
      required: [id, bookId, position, title, description, pageNumber]
      properties:
        id: { type: integer }
        bookId: { type: integer }
        position: { type: integer }
        title: { type: string }
        description: { type: ["string", "null"] }
        pageNumber: { type: ["integer", "null"] }
    BookDetail:
      type: object
      required: [book, sections]
      properties:
        book: { $ref: "#/components/schemas/Book" }
        sections:
          type: array
          items: { $ref: "#/components/schemas/BookSection" }
    BookSearchResults:
      type: object
      required: [items, total, limit, offset, categories]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Book" }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        categories:
          type: array
          items: { type: string }
    CategoryCount:
      type: object
      required: [name, count]
      properties:
        name: { type: string }
        count: { type: integer }
    LibraryOverview:
      type: object
      required: [featuredBooks, recentBooks, categoryCounts, totalBooks, totalSections]
      properties:
        featuredBooks:
          type: array
          items: { $ref: "#/components/schemas/Book" }
        recentBooks:
          type: array
          items: { $ref: "#/components/schemas/Book" }
        categoryCounts:
          type: array
          items: { $ref: "#/components/schemas/CategoryCount" }
        totalBooks: { type: integer }
        totalSections: { type: integer }
    ReadingProgress:
      type: object
      required: [bookId, pageNumber, progressPercent, updatedAt]
      properties:
        bookId: { type: integer }
        pageNumber: { type: ["integer", "null"] }
        progressPercent: { type: number, minimum: 0, maximum: 100 }
        updatedAt: { type: string, format: date-time }
    AccountLibrary:
      type: object
      required: [favorites, progress]
      properties:
        favorites:
          type: array
          items: { $ref: "#/components/schemas/Book" }
        progress:
          type: array
          items: { $ref: "#/components/schemas/ReadingProgress" }
    FavoriteStatus:
      type: object
      required: [bookId, favorite]
      properties:
        bookId: { type: integer }
        favorite: { type: boolean }
    ProgressInput:
      type: object
      required: [progressPercent]
      properties:
        pageNumber: { type: ["integer", "null"], minimum: 0 }
        progressPercent: { type: number, minimum: 0, maximum: 100 }
    BookSectionInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: ["string", "null"] }
        pageNumber: { type: ["integer", "null"], minimum: 1 }
    BookInput:
      type: object
      required: [title, author, description, category, featured, status]
      properties:
        title: { type: string, minLength: 1 }
        author: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        category: { type: string, minLength: 1 }
        coverUrl: { type: ["string", "null"], format: uri }
        readerUrl: { type: ["string", "null"], format: uri }
        downloadUrl: { type: ["string", "null"], format: uri }
        featured: { type: boolean }
        publishedYear: { type: ["integer", "null"], minimum: 1 }
        status: { type: string, enum: [published, draft] }
        sections:
          type: array
          items: { $ref: "#/components/schemas/BookSectionInput" }
    BookUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        author: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        category: { type: string, minLength: 1 }
        coverUrl: { type: ["string", "null"], format: uri }
        readerUrl: { type: ["string", "null"], format: uri }
        downloadUrl: { type: ["string", "null"], format: uri }
        featured: { type: boolean }
        publishedYear: { type: ["integer", "null"], minimum: 1 }
        status: { type: string, enum: [published, draft] }
        sections:
          type: array
          items: { $ref: "#/components/schemas/BookSectionInput" }
    AdminOverview:
      type: object
      required: [bookCount, publishedCount, draftCount, sectionCount, readerCount]
      properties:
        bookCount: { type: integer }
        publishedCount: { type: integer }
        draftCount: { type: integer }
        sectionCount: { type: integer }
        readerCount: { type: integer }

